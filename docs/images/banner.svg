<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#336791"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <rect width="900" height="200" rx="12" fill="url(#grid)"/>
  <!-- Database split/arrows icon -->
  <g transform="translate(100, 100)" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2">
    <!-- Source database -->
    <ellipse cx="-20" cy="-25" rx="16" ry="6" fill="rgba(255,255,255,0.1)"/>
    <path d="M -36,-25 L -36,5 C -36,8.3 -28.8,11 -20,11 C -11.2,11 -4,8.3 -4,5 L -4,-25"/>
    <ellipse cx="-20" cy="-10" rx="16" ry="6" stroke="rgba(255,255,255,0.4)" fill="none"/>
    <!-- Split arrows -->
    <line x1="0" y1="-15" x2="15" y2="-28" stroke-width="2"/>
    <polyline points="10,-28 15,-28 15,-23" fill="none" stroke-width="2"/>
    <line x1="0" y1="0" x2="15" y2="13" stroke-width="2"/>
    <polyline points="10,13 15,13 15,8" fill="none" stroke-width="2"/>
    <!-- Target databases -->
    <ellipse cx="28" cy="-32" rx="10" ry="4" fill="rgba(255,255,255,0.1)"/>
    <path d="M 18,-32 L 18,-18 C 18,-15.8 22.5,-14 28,-14 C 33.5,-14 38,-15.8 38,-18 L 38,-32"/>
    <ellipse cx="28" cy="10" rx="10" ry="4" fill="rgba(255,255,255,0.1)"/>
    <path d="M 18,10 L 18,24 C 18,26.2 22.5,28 28,28 C 33.5,28 38,26.2 38,24 L 38,10"/>
  </g>
  <!-- Title -->
  <text x="480" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">migrate-psql</text>
  <!-- Subtitle -->
  <text x="480" y="125" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.75)" text-anchor="middle">CloudSQL PostgreSQL database splitting tool</text>
</svg>